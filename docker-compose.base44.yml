# GeoSiaga — sandbox/dev environment (Base44)
#
# Everything runs from the cloned source with live reload:
#   web  : Vite dev server on host port 3000 (the preview entry point)
#   api  : server.mjs (the same /api/* handlers as on Vercel) with node --watch,
#          reached through Vite's dev proxy at /api/*
#   deps : one-shot `npm ci` that populates the shared node_modules volume
#
# Docs: see AGENTS.md.

name: geosiaga

services:
  deps:
    image: node:22-bookworm-slim
    working_dir: /app
    command: ["sh", "-ec", "npm ci --no-audit --no-fund"]
    volumes:
      - .:/app
      - node_modules:/app/node_modules
    environment:
      - BASE44_PREVIEW_MODE
    restart: "no"

  api:
    image: node:22-bookworm-slim
    working_dir: /app
    depends_on:
      deps:
        condition: service_completed_successfully
    volumes:
      - .:/app
      - node_modules:/app/node_modules
    env_file:
      # Optional external credentials (NASA FIRMS key, VAPID push keys) delivered
      # by the platform. Kept LAST so the user's values always win.
      - /run/base44/app.env
    environment:
      - PORT=8080
      - BASE44_PREVIEW_MODE
    command: ["sh", "-ec", "exec node --watch server.mjs"]
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:8080/api/push/public-key').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 30s
    restart: on-failure
    labels:
      base44.project: "GeoSiaga API"
      base44.kind: api

  web:
    image: node:22-bookworm-slim
    working_dir: /app
    depends_on:
      deps:
        condition: service_completed_successfully
      api:
        condition: service_healthy
    volumes:
      - .:/app
      - node_modules:/app/node_modules
    environment:
      - BASE44_PREVIEW_MODE
      # Vite >= 6.1 appends this to server.allowedHosts so the proxy host is served.
      - __VITE_ADDITIONAL_SERVER_ALLOWED_HOSTS
      - CHOKIDAR_USEPOLLING=${CHOKIDAR_USEPOLLING:-1}
    ports:
      - "3000:3000"
    command: ["sh", "-ec", "exec npm run dev -- --host 0.0.0.0 --port 3000"]
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 30s
    restart: on-failure
    labels:
      base44.project: "GeoSiaga"
      base44.kind: web
      base44.port: 3000

volumes:
  node_modules:
